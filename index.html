<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Day 87</title>
<style>
  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #24243e;
    --accent: #ff2e63;
    --accent2: #08d9d6;
    --text: #f5f5f5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* subtle animated grid background */
  #stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: drift 30s linear infinite;
    pointer-events: none;
  }

  @keyframes drift {
    from { background-position: 0 0; }
    to { background-position: 400px 400px; }
  }

  #center-msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(245, 245, 245, 0.18);
    font-weight: 700;
    white-space: nowrap;
    user-select: none;
  }

  #confetti-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
  }

  #counter {
    position: absolute;
    top: 32px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  #counter h1 {
    margin: 0;
    font-size: clamp(1.4rem, 4vw, 2.6rem);
    color: var(--text);
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(255, 46, 99, 0.6), 0 0 40px rgba(8, 217, 214, 0.3);
  }

  #counter .day-number {
    color: var(--accent2);
    font-weight: 800;
  }

  #counter p {
    margin: 6px 0 0;
    font-size: 0.85rem;
    color: rgba(245,245,245,0.55);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  #bouncer {
    position: absolute;
    width: 130px;
    height: 130px;
    will-change: transform;
  }

  #pulse {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    box-shadow:
      0 0 0 4px rgba(255,255,255,0.9),
      0 0 25px 6px var(--glow, var(--accent)),
      0 10px 30px rgba(0,0,0,0.5);
    transition: box-shadow 0.4s ease;
  }

  #bouncer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    user-select: none;
  }

  #hitcount {
    position: absolute;
    bottom: 24px;
    right: 28px;
    color: rgba(245,245,245,0.4);
    font-size: 0.8rem;
    letter-spacing: 1px;
    z-index: 10;
  }

  #hitcount span {
    color: var(--accent2);
    font-weight: 700;
  }

  .credit {
    position: absolute;
    bottom: 24px;
    left: 28px;
    color: rgba(245,245,245,0.35);
    font-size: 0.75rem;
    letter-spacing: 1px;
    z-index: 10;
  }
</style>
</head>

<script>
  const el = document.getElementById('bouncer');
  const pulseEl = document.getElementById('pulse');
  const stage = document.getElementById('stage');
  const hitsEl = document.getElementById('hits');

  let hits = 0;

  // starting position & velocity
  let x = 60, y = 60;
  let vx = 2.4, vy = 2.1;

  const colors = ['#ff2e63', '#08d9d6', '#f9c80e', '#a663cc', '#3ec1d3', '#ff6b6b'];
  let colorIndex = 0;

  // timestamps of the most recent x-edge and y-edge bounces, used to
  // detect "corner" hits even when the two edges aren't hit on the
  // exact same animation frame
  let lastXBounce = -Infinity;
  let lastYBounce = -Infinity;
  const CORNER_WINDOW_MS = 120;

  function size() {
    return el.getBoundingClientRect().width;
  }

  function jitter() {
    // small random nudge to velocity so the path isn't a perfectly
    // repeating loop that can permanently miss every corner
    const angle = (Math.random() - 0.5) * 0.35; // small rotation
    const speed = Math.hypot(vx, vy);
    const currentAngle = Math.atan2(vy, vx) + angle;
    vx = Math.cos(currentAngle) * speed;
    vy = Math.sin(currentAngle) * speed;
    setTimeout(jitter, 3000 + Math.random() * 4000);
  }
  setTimeout(jitter, 3000 + Math.random() * 4000);

  function step(now) {
    const boxSize = size();
    const maxX = stage.clientWidth - boxSize;
    const maxY = stage.clientHeight - boxSize;

    x += vx;
    y += vy;

    let xBounced = false;
    let yBounced = false;

    if (x <= 0) { x = 0; vx = Math.abs(vx); xBounced = true; }
    if (x >= maxX) { x = maxX; vx = -Math.abs(vx); xBounced = true; }
    if (y <= 0) { y = 0; vy = Math.abs(vy); yBounced = true; }
    if (y >= maxY) { y = maxY; vy = -Math.abs(vy); yBounced = true; }

    if (xBounced) lastXBounce = now;
    if (yBounced) lastYBounce = now;

    const cornerHit = (xBounced && Math.abs(now - lastYBounce) <= CORNER_WINDOW_MS) ||
                       (yBounced && Math.abs(now - lastXBounce) <= CORNER_WINDOW_MS);

    if (xBounced || yBounced) {
      colorIndex = (colorIndex + 1) % colors.length;
      pulseEl.style.setProperty('--glow', colors[colorIndex]);

      // little pulse effect on bounce — animates the inner element only,
      // so it never touches the outer element's translate transform
      pulseEl.animate(
        [{ transform: cornerHit ? 'scale(1.35)' : 'scale(1.15)' }, { transform: 'scale(1)' }],
        { duration: cornerHit ? 400 : 260, easing: 'ease-out' }
      );
    }

    if (cornerHit) {
      hits++;
      hitsEl.textContent = hits;
    }

    el.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame((t) => step(t));
  }

  // keep it inside bounds if window resizes
  window.addEventListener('resize', () => {
    const boxSize = size();
    x = Math.min(x, stage.clientWidth - boxSize);
    y = Math.min(y, stage.clientHeight - boxSize);
  });

  requestAnimationFrame((t) => step(t));
</script>

<script>
  // ---------- confetti engine ----------
  const cCanvas = document.getElementById('confetti-canvas');
  const ctx = cCanvas.getContext('2d');
  const confettiColors = ['#ff2e63', '#08d9d6', '#f9c80e', '#a663cc', '#3ec1d3', '#ff6b6b', '#ffffff'];

  let particles = [];
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas() {
    cCanvas.width = window.innerWidth * DPR;
    cCanvas.height = window.innerHeight * DPR;
    cCanvas.style.width = window.innerWidth + 'px';
    cCanvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function makeParticle(x, y, opts = {}) {
    const angle = opts.angle ?? rand(0, Math.PI * 2);
    const speed = opts.speed ?? rand(4, 16);
    return {
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (opts.upBias ?? 0),
      size: rand(6, 12),
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      rotation: rand(0, 360),
      rotationSpeed: rand(-12, 12),
      shape: Math.random() < 0.5 ? 'rect' : 'circle',
      gravity: opts.gravity ?? 0.28,
      drag: opts.drag ?? 0.992,
      life: 0,
      maxLife: opts.maxLife ?? rand(90, 160),
      opacity: 1
    };
  }

  // big burst radiating from the center of the screen
  function burstFromCenter() {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const count = 420;
    for (let i = 0; i < count; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(6, 26);
      particles.push(makeParticle(cx, cy, { angle, speed, gravity: rand(0.22, 0.35), maxLife: rand(110, 200) }));
    }
  }

  // secondary smaller bursts shortly after, for a fireworks feel
  function scheduleFollowupBursts() {
    const spots = [
      [0.25, 0.35], [0.75, 0.35], [0.5, 0.6], [0.35, 0.25], [0.65, 0.25]
    ];
    spots.forEach((pos, i) => {
      setTimeout(() => {
        const cx = window.innerWidth * pos[0];
        const cy = window.innerHeight * pos[1];
        for (let j = 0; j < 120; j++) {
          const angle = rand(0, Math.PI * 2);
          const speed = rand(3, 14);
          particles.push(makeParticle(cx, cy, { angle, speed, gravity: 0.3, maxLife: rand(80, 140) }));
        }
      }, 220 * (i + 1));
    });
  }

  // cursor trail — spawns a light stream of confetti as the mouse moves
  let lastCursorSpawn = 0;
  function spawnCursorConfetti(x, y) {
    const now = performance.now();
    if (now - lastCursorSpawn < 16) return; // throttle
    lastCursorSpawn = now;
    const amount = rand(1, 3);
    for (let i = 0; i < amount; i++) {
      particles.push(makeParticle(x + rand(-6, 6), y + rand(-6, 6), {
        angle: rand(0, Math.PI * 2),
        speed: rand(0.5, 3),
        gravity: 0.15,
        maxLife: rand(40, 80)
      }));
    }
  }

  window.addEventListener('pointermove', (e) => {
    spawnCursorConfetti(e.clientX, e.clientY);
  });

  // light continuous sparkle for touch devices (no pointermove without touch)
  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) {
      spawnCursorConfetti(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  function drawParticle(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    if (p.shape === 'rect') {
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function updateConfetti() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    particles = particles.filter(p => p.life < p.maxLife && p.y < window.innerHeight + 60);

    for (const p of particles) {
      p.life++;
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotationSpeed;

      // fade out over the last 25% of life
      const fadeStart = p.maxLife * 0.75;
      p.opacity = p.life > fadeStart ? Math.max(0, 1 - (p.life - fadeStart) / (p.maxLife - fadeStart)) : 1;

      drawParticle(p);
    }

    requestAnimationFrame(updateConfetti);
  }

  // kick off: big center burst + a couple of followups, every time the page loads
  burstFromCenter();
  scheduleFollowupBursts();
  requestAnimationFrame(updateConfetti);
</script>
